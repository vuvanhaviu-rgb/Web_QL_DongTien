name: Kéo chi phí Facebook

on:
  schedule:
    - cron: "*/30 * * * *"   # mỗi 30 phút
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save
      - run: node scripts/fb-sync.js
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LIVE_WORD: ${{ vars.LIVE_WORD }}
