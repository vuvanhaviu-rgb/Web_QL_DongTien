name: Kéo chi phí Facebook

on:
  schedule:
    - cron: "0 * * * *"   # mỗi 1 giờ
  workflow_dispatch:
    inputs:
      fill_date:
        description: "Điền chi phí của ngày này vào bảng chi tiêu (định dạng 2026-10-27). Để trống = chạy bình thường"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save
      - run: node scripts/fb-sync.js
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LIVE_WORD: ${{ vars.LIVE_WORD }}
          FILL_DATE: ${{ github.event.inputs.fill_date }}
