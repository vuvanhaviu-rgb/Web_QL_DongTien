name: Thử lấy người tiếp cận loại trùng (chỉ đọc)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save
      - run: node scripts/thu-tiep-can.js
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
