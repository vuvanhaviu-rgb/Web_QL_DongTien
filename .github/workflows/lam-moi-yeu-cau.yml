name: Làm mới theo yêu cầu (link chia sẻ)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lam-moi
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install firebase-admin --no-save --no-audit --no-fund --loglevel=error
      - run: node scripts/lam-moi-yeu-cau.js
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          LIVE_WORD: ${{ vars.LIVE_WORD }}
