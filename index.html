<html lang="vi">
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VH Agency">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">

<style>
/* Layout: sidebar with 5 sections on the left (tab strip on phones), one working area on the right.
   Palette: Meta-blue accent (#0B66FF) on a faintly green-grey ground; amber and red are status colors only.
   Type: Be Vietnam Pro throughout (drawn for Vietnamese), weights 400-700, tabular figures for money. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7F9F8; --fg:#14211F; --muted:#5A6B68; --line:#D8E0DE;
  --accent:#0B66FF; --accent-fg:#FFFFFF; --accent-soft:#E1ECFF;
  --ok:#1B7F4B; --ok-soft:#DDF2E5; --wait:#8A5A00; --wait-soft:#FBEFD2; --bad:#B42318; --bad-soft:#FBE4E1;
  --bar-a:#A9BEDF; --bar-b:#0B66FF; --shadow:0 1px 2px rgba(20,33,31,.06);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#152120; --surface-2:#1A2928; --fg:#E5EEEC; --muted:#93A8A4;
  --line:#273937; --accent:#5B9BFF; --accent-fg:#06142B; --accent-soft:#1A2C4D;
  --ok:#5FD58F; --ok-soft:#173A27; --wait:#F0B94D; --wait-soft:#3B2E10; --bad:#FF8A7D; --bad-soft:#42201C;
  --bar-a:#4B5F80; --bar-b:#5B9BFF; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#152120; --surface-2:#1A2928; --fg:#E5EEEC; --muted:#93A8A4;
  --line:#273937; --accent:#5B9BFF; --accent-fg:#06142B; --accent-soft:#1A2C4D;
  --ok:#5FD58F; --ok-soft:#173A27; --wait:#F0B94D; --wait-soft:#3B2E10; --bad:#FF8A7D; --bad-soft:#42201C;
  --bar-a:#4B5F80; --bar-b:#5B9BFF; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:10px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:20px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand b{font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:8px;color:var(--muted);
  text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{min-width:20px;padding:0 6px;border-radius:10px;background:var(--bad);color:var(--accent-fg);font-size:10px;font-weight:700;text-align:center;line-height:20px}
:root:not([data-theme="dark"]) .badge{color:#fff}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:18px;font-weight:700;letter-spacing:-.02em}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 10px;font-size:10px;box-shadow:none}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow)}
.kpi span{color:var(--muted);font-size:10px;font-weight:500}
.kpi b{font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted);font-size:10px}
.kpi.bad b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-size:12px;font-weight:600}
.panel h2 small{color:var(--muted);font-weight:400;margin-left:6px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.panel .tablewrap{border:0;border-radius:0;background:none}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:10px;text-align:left;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td .sub{display:block;color:var(--muted);font-size:10px}
td.act{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:10px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
input[type=search],input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:8px 10px}
.tools input[type=search],.tools select{width:auto;min-width:180px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:12px}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .l b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .l span{color:var(--muted);font-size:10px}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-family:var(--font);font-size:var(--fs,12px)}
svg.chart line{stroke:var(--line)}
.hbar{display:flex;flex-direction:column;gap:4px;padding:6px 0}
.hbar .t{display:flex;justify-content:space-between;gap:12px}
.hbar .t span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hbar .t span:first-child{overflow-wrap:anywhere}
.track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;background:var(--bar-b);border-radius:4px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.note{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--wait-soft);color:var(--wait);
  border-radius:10px;padding:10px 14px;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(8,16,15,.5);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:15px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:600;font-size:10px}
.field .err{color:var(--bad);font-size:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:4px}
.foot .grp{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);
  padding:9px 16px;border-radius:8px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
button.link{border:0;background:none;padding:0;font-weight:700;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].y{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].n{background:var(--wait-soft);color:var(--wait)}
table.ledger{min-width:980px}
table.ledger th.grp{text-align:center;border-bottom:1px solid var(--line)}
table.ledger thead tr+tr th{font-weight:500}
table.ledger tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0;font-variant-numeric:tabular-nums}
td.owe{color:var(--bad);font-weight:700}
td.clear{color:var(--ok);font-weight:700}
.notice.warn{background:#fdecea;border:1px solid #f5c2bd;color:#9b1c10;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:12px}.sub.warn,td.warn{color:#b26a00}.bank-in{width:100%;font:inherit;font-size:16px;font-weight:700;padding:4px 6px;border:1px solid var(--line,#ddd);border-radius:6px;background:transparent;color:inherit;margin:4px 0}.bill-in{font:inherit;font-size:10px;padding:4px 6px;border:1px solid var(--line,#ddd);border-radius:6px;background:transparent;color:inherit}.thr-in{width:110px;font:inherit;font-size:10px;text-align:right;padding:4px 6px;border:1px solid var(--line,#ddd);border-radius:6px;background:transparent;color:inherit}.dayp{display:inline-flex;white-space:nowrap;align-items:center;gap:6px;font-size:10px;color:var(--muted)}.dayp input{font:inherit;font-size:10px;padding:5px 8px;border:1px solid var(--line,#ddd);border-radius:8px;background:transparent;color:inherit}#vw-day{width:auto;font:inherit;font-size:10px;padding:5px 8px}.sharecamp{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);flex-basis:100%;margin-top:6px}.hint{margin:0;color:var(--muted);font-size:10px}
input[type=month]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ph{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.pick{gap:8px}
.pick input,.pick select{width:auto;min-width:0}
.pick input[type=number]{width:92px}
.pick select{min-width:128px}
input.dmy{width:128px!important;min-width:0;text-align:center}
.kpis.in .kpi{background:var(--surface-2);box-shadow:none}
table.ledger{min-width:1120px}
table.ledger th,table.ledger td{border:1px solid var(--line)}
table.ledger td.cell{padding:0;min-width:104px}
table.ledger input.cin{width:100%;min-width:0;border:0;background:transparent;padding:9px 10px;border-radius:0;font-variant-numeric:tabular-nums}
table.ledger input.cin.n{text-align:right}
table.ledger input[type=date].cin{min-width:138px}
table.ledger input.cin:focus{outline:2px solid var(--accent);outline-offset:-2px;background:var(--surface)}
table.ledger .pc{display:flex;align-items:center;padding-right:8px;min-width:70px}
table.ledger .pc span{color:var(--muted)}
table.ledger td.calc{background:var(--surface-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.ledger td.act{border-left:0;border-right:0}
td.num,th.num,td.act{text-align:center}
.tog{border:0;border-radius:999px;padding:3px 9px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap}
.tog.y{background:var(--ok-soft);color:var(--ok)}
.tog.n{background:var(--wait-soft);color:var(--wait)}
.tog:hover{filter:brightness(.96)}
table.ledger{min-width:900px;width:100%;table-layout:fixed;font-size:10px}
table.ledger th,table.ledger td{text-align:center;vertical-align:middle;padding:4px 4px}
table.ledger th{font-size:10px;white-space:normal;line-height:1.3}
table.ledger td.cell{padding:0;min-width:0}
table.ledger input.cin,table.ledger input.cin.n{text-align:center;padding:5px 2px;font-size:10px}
table.ledger input[type=date].cin{min-width:0}
table.ledger td.calc,table.ledger td.num,table.ledger th.num,table.ledger tfoot td{text-align:center}
table.ledger .pc{justify-content:center;padding-right:0;min-width:0;gap:2px}
table.ledger td.act{padding:4px 2px}
table.ledger td.act .btn{padding:3px 6px;font-size:10px}
table.ledger tr.mh td{background:var(--surface-2);font-weight:700;border-top:2px solid var(--line);font-variant-numeric:tabular-nums}
table.ledger tr.mh td:first-child{color:var(--accent)}
table.ledger tr.mh{cursor:pointer}table.ledger tr.mh:hover td{filter:brightness(.97)}
table.ledger tr.hid{display:none}
table.ledger tr.mh .unh{margin-left:8px;padding:2px 8px;font-size:10px;font-weight:600}
table.ledger tr.blank td{color:var(--muted)}
table.ledger tr.blank.we td{background:var(--surface-2)}
table.ledger tr.today td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
table.ledger td.dcell{white-space:nowrap}table.ledger td.dcell small{color:var(--muted);font-weight:600;margin-left:2px}
table.ledger td.dash{color:var(--muted)}
.row .l .link{display:block}
td.net,th.net{color:var(--accent);font-weight:700}
.kpi.net b{color:var(--accent)}
/* KPI dạng thẻ có biểu tượng */
.kpi{position:relative;display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:center;border:1px solid rgba(var(--kc),.25);border-bottom:3px solid rgb(var(--kc));background:linear-gradient(135deg,rgba(var(--kc),.10),rgba(var(--kc),.02) 70%),var(--surface);--kc:47,140,255}

.kpi>*{grid-column:2}
.kpi span{color:var(--fg)}
.kpi b{color:rgb(var(--kc))}

  table.ledger td.act .btn{padding:6px;width:100%}

  .head{padding:4px 0}

var ui={view:"tong-quan",q:"",pf:"all",pc:"",cid:"",ap:"month",anchor:todayStr(),delArm:"",pendingFocus:null,mopen:{},pend:{},shared:{}};

/* ---------- data layer ---------- */
function toast(msg){var r=$("#toast-root");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(function(){r.innerHTML=""},3200)}
/* ghi lại thời điểm THẬT mỗi lần số tiền khách chuyển thay đổi (app tự lưu, không cần nhập ngày) */
function withXfLog(id,data){
  if(data.transfer===undefined)return data;
  var r=id?S.spend.filter(function(x){return x.id===id})[0]:null,old=r?Number(r.transfer)||0:0,nv=Number(data.transfer)||0;
  if(nv===old)return data;
  var log=(r&&Array.isArray(r.xfLog)?r.xfLog:[]).concat([{at:Date.now(),v:nv-old}]);
  return Object.assign({},data,{xfLog:log});
}
async function save(col,id,data){
  if(col==="spend")data=withXfLog(id,data);
  if(localMode){
    if(id){var i=S[col].findIndex(function(x){return x.id===id});S[col][i]=Object.assign({},S[col][i],data)}
    else S[col].push(Object.assign({id:"l"+(++seq),createdAt:Date.now()},data));
    render();return;
  }
  try{
    if(id)await db.collection(col).doc(id).update(data);
    else await db.collection(col).add(Object.assign({createdAt:Date.now()},data));
  }catch(e){toast("Không lưu được: "+((e&&(e.message||e.code))||"lỗi không rõ"))}
}
async function remove(col,id){
  if(col==="customers"&&!localMode&&db){var cc=cust(id);if(cc&&cc.shareToken){try{await db.collection("shares").doc(cc.shareToken).delete()}catch(e){}}}
  if(localMode){S[col]=S[col].filter(function(x){return x.id!==id});render();return}
  try{await db.collection(col).doc(id).delete()}catch(e){toast("Không xóa được: "+((e&&(e.message||e.code))||"lỗi không rõ"))}
}
async function clearExamples(){
  var jobs=[];
  COLS.forEach(function(c){S[c].forEach(function(x){if(x.example)jobs.push([c,x.id])})});
  for(var i=0;i<jobs.length;i++){await remove(jobs[i][0],jobs[i][1])}
  toast("Đã xóa dữ liệu ví dụ");
}
/* ---------- backup / restore ---------- */
function bkStamp(){try{return localStorage.getItem("bk-last")}catch(e){return null}}
function bkShow(){
  var el=document.getElementById("bk-last");if(!el)return;
  var t=bkStamp();
  if(!t){el.textContent="Chưa sao lưu lần nào. Nên tải bản sao lưu mỗi tuần.";el.className="warn";return}
  var days=Math.floor((Date.now()-Number(t))/86400000);
  el.textContent="Lần gần nhất: "+new Date(Number(t)).toLocaleDateString("vi-VN")+(days>=7?" ("+days+" ngày trước, nên sao lưu lại)":"");
  el.className=days>=7?"warn":"";
}
function bkSave(){
  if(!ready()){toast("Dữ liệu chưa tải xong");return}
  var out={app:"quan-ly-dong-tien",version:1,exportedAt:new Date().toISOString(),data:{}};
  COLS.forEach(function(c){out.data[c]=S[c].map(function(x){return x})});
  var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="sao-luu-dong-tien-"+todayStr()+".json";document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  try{localStorage.setItem("bk-last",String(Date.now()))}catch(e){}
  bkShow();toast("Đã tải bản sao lưu về máy");
}
async function bkRestore(file){
  var obj;
  try{obj=JSON.parse(await file.text())}catch(e){toast("File không đọc được");return}
  if(!obj||obj.app!=="quan-ly-dong-tien"||!obj.data){toast("Đây không phải file sao lưu của trang này");return}
  var n=0;COLS.forEach(function(c){n+=(obj.data[c]||[]).length});
  if(!confirm("Khôi phục "+n+" bản ghi từ file sao lưu ngày "+String(obj.exportedAt||"").slice(0,10)+"?\nDữ liệu cùng mã sẽ được ghi đè, dữ liệu mới thêm sau bản sao lưu vẫn được giữ."))return;
  var failed=0;
  for(var i=0;i<COLS.length;i++){
    var c=COLS[i],rows=obj.data[c]||[];
    for(var j=0;j<rows.length;j++){
      var r=Object.assign({},rows[j]),id=r.id;delete r.id;
      if(localMode){var k=S[c].findIndex(function(x){return x.id===id});if(k>=0)S[c][k]=Object.assign({id:id},r);else S[c].push(Object.assign({id:id},r));continue}
      try{await db.collection(c).doc(id).set(r)}catch(e){failed++}
    }
  }
  render();
  toast(failed?"Khôi phục xong, lỗi "+failed+" bản ghi":"Đã khôi phục "+n+" bản ghi");
}
document.addEventListener("click",function(e){
  var ab=e.target&&e.target.closest?e.target.closest("[data-act=logout],[data-act=bk-dismiss],[data-act=bk-auto]"):null;
  if(ab){if(ab.dataset.act==="bk-auto"){bkAuto()}else if(ab.dataset.act==="logout"){if(window.__logout)window.__logout();else toast("Chưa đăng nhập")}else{try{sessionStorage.setItem("bk-dismiss","1")}catch(x){}render()}return}
  var t=e.target;if(!t||!t.id)return;
  if(t.id==="bk-save")bkSave();
  else if(t.id==="bk-load")document.getElementById("bk-file").click();
});
document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="bk-file"&&e.target.files[0]){bkRestore(e.target.files[0]);e.target.value=""}
});

/* ---------- chia sẻ link xem (không cần đăng nhập) ---------- */
var VIEW_TOKEN=(function(){try{return new URLSearchParams(location.search).get("v")||""}catch(e){return ""}})();
function newToken(){var a=new Uint8Array(18);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ("0"+b.toString(36)).slice(-2)}).join("").slice(0,28)}
function shareLink(t){return location.origin+location.pathname+"?v="+t}
function sharePayload(c){
  var rows=S.spend.filter(function(r){return r.customerId===c.id&&r.date}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))||((a.createdAt||0)-(b.createdAt||0))})
    .map(function(r){return{date:r.date,adLive:Number(r.adLive)||0,adPost:Number(r.adPost)||0,feeRate:rateOf(r),transfer:Number(r.transfer)||0,paid:!!r.paid}});
  var out={name:c.name,rows:rows};
  if(c.shareCamps!==false){
    var cut=ymd(new Date(Date.now()-6*864e5)),cd=S.fbspend.filter(function(r){return r.customerId===c.id&&r.date>=cut&&r.camps&&r.camps.length})
      .sort(function(a,b){return String(b.date).localeCompare(String(a.date))}).map(function(r){return{date:r.date,items:r.camps.map(function(x){return{n:x.n,s:x.s,k:x.k}})}});
    if(cd.length)out.camps=cd;
  }
  return out;
}
function syncShares(force){
  if(localMode||!db||!ready())return;
  S.customers.forEach(function(c){
    if(!c.shareToken)return;
    var p=sharePayload(c),key=JSON.stringify(p);
    if(!force&&ui.shared[c.shareToken]===key)return;
    ui.shared[c.shareToken]=key;
    db.collection("shares").doc(c.shareToken).set(Object.assign({},p,{updatedAt:Date.now()})).catch(function(e){delete ui.shared[c.shareToken];toast("Không cập nhật được link chia sẻ: "+((e&&(e.message||e.code))||"lỗi"))});
  });
}
var shareTimer=null;
function scheduleShare(){clearTimeout(shareTimer);shareTimer=setTimeout(function(){syncShares(false)},900)}
async function startShare(){
  var c=cust(ui.cid);if(!c)return;
  if(localMode||!db){toast("Cần kết nối cơ sở dữ liệu để chia sẻ");return}
  await save("customers",c.id,{shareToken:newToken()});
  scheduleShare();
}
async function stopShare(){
  var c=cust(ui.cid);if(!c||!c.shareToken)return;
  if(!confirm("Tắt chia sẻ? Link đã gửi sẽ không mở được nữa."))return;
  var t=c.shareToken;
  try{await db.collection("shares").doc(t).delete()}catch(e){}
  delete ui.shared[t];
  await save("customers",c.id,{shareToken:null});
}
function copyShare(){
  var inp=document.getElementById("share-url");if(!inp)return;
  var done=function(){toast("Đã sao chép link")};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(done,function(){inp.select();document.execCommand("copy");done()});
  else{inp.select();document.execCommand("copy");done()}
}
function shareBox(c){

async function viewerInit(){
  document.body.classList.add("viewer");
  var main=$("#main");main.innerHTML=loadingBlock();
  var cl=window.claude;
  try{db=cl&&cl.use?await cl.use("db"):null}catch(e){db=null}
  if(!db){main.innerHTML=emptyBlock("Chưa mở được trang","Trang chưa được kết nối.");return}
  try{
    var snap=await db.collection("shares").doc(VIEW_TOKEN).get();
    if(!snap.exists){main.innerHTML=emptyBlock("Link không còn hiệu lực","Người gửi đã tắt chia sẻ hoặc link chưa đúng.");return}
    ui.vdata=snap.data();main.innerHTML=viewerHtml(ui.vdata);tagKpis(main);
  }catch(e){main.innerHTML=emptyBlock("Không mở được link","Chủ trang có thể chưa bật quyền xem công khai cho link chia sẻ.")}
}

async function init(){
  if(VIEW_TOKEN){viewerInit();return}
  bkShow();
  render();
  var cl=window.claude;
  try{db=cl&&cl.use?await cl.use("db"):null}catch(e){db=null}
  if(!db){localMode=true;render();return}
  var cutoff=ymd(new Date(Date.now()-62*864e5));
  COLS.forEach(function(c){
    /* chi tiêu Facebook chỉ cần 62 ngày gần nhất: đọc ít hơn để không vượt hạn mức miễn phí của Firebase */
    var q=c==="fbspend"?db.collection(c).where("date",">=",cutoff):db.collection(c);
    q.onSnapshot(function(snap){
      S[c]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      loaded[c]=true;render();scheduleShare();
    },function(){loaded[c]=true;render()});
  });
}

/* ---------- advertising by period ---------- */
var APT=[["day","Ngày"],["month","Tháng"],["quarter","Quý"],["year","Năm"]];
function ymd(dt){return dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate())}
function lastDay(y,m){return new Date(y,m,0).getDate()}
function periodOf(type,a){
  var y=+a.slice(0,4),m=+a.slice(5,7);
  if(type==="day")return{from:a,to:a,label:"Ngày "+fmtDate(a),keyLen:10};
  if(type==="month")return{from:y+"-"+pad(m)+"-01",to:y+"-"+pad(m)+"-"+pad(lastDay(y,m)),label:"Tháng "+m+"/"+y,keyLen:10};
  if(type==="quarter"){var q=Math.floor((m-1)/3),m1=q*3+1,m3=m1+2;return{from:y+"-"+pad(m1)+"-01",to:y+"-"+pad(m3)+"-"+pad(lastDay(y,m3)),label:"Quý "+(q+1)+"/"+y,keyLen:7}}
  return{from:y+"-01-01",to:y+"-12-31",label:"Năm "+y,keyLen:7};
}
function shiftAnchor(type,a,dir){
  var y=+a.slice(0,4),m=+a.slice(5,7),d=+a.slice(8,10);
  if(type==="day")return ymd(new Date(y,m-1,d+dir));
  if(type==="month")return ymd(new Date(y,m-1+dir,1));
  if(type==="quarter")return ymd(new Date(y,m-1+3*dir,1));
  return ymd(new Date(y+dir,0,1));
}
function spendRow(r){
  var live=Number(r.adLive)||0,post=Number(r.adPost)||0,ad=live+post;
  var rate=r.feeRate!=null&&r.feeRate!==""?Number(r.feeRate):defaultRate(r.customerId),fee=Math.round(ad*rate/100);
  var bank=Math.round(ad*BANK_FEE/100);return{live:live,post:post,fee:fee,tot:ad+fee,xf:Number(r.transfer)||0,bank:bank,net:fee-bank};
}
function adChart(buckets,bk){
  var mx0=0;buckets.forEach(function(b){var v=bk[b.k];if(v)mx0=Math.max(mx0,v.live+v.post)});
  if(!mx0)return"";
  var mx=niceMax(mx0),W=640,H=230,L=56,R=10,T=12,B=26,pw=W-L-R,ph=H-T-B,n=buckets.length,gw=pw/n,bw=Math.min(28,gw*.7);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ chi phí quảng cáo theo kỳ">';
  for(var t=0;t<=4;t++){var y=T+ph-ph*t/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+short(mx*t/4)+'</text>'}
  buckets.forEach(function(b,i){
    var v=bk[b.k]||{live:0,post:0},cx=L+gw*i+gw/2,h1=ph*v.live/mx,h2=ph*v.post/mx;
    if(v.live)s+='<rect x="'+(cx-bw/2)+'" y="'+(T+ph-h1)+'" width="'+bw+'" height="'+h1+'" fill="var(--bar-b)"><title>'+esc(b.t)+' · Live: '+vnd(v.live)+'</title></rect>';
    if(v.post)s+='<rect x="'+(cx-bw/2)+'" y="'+(T+ph-h1-h2)+'" width="'+bw+'" height="'+h2+'" fill="var(--bar-a)"><title>'+esc(b.t)+' · Bài viết: '+vnd(v.post)+'</title></rect>';
    if(b.show)s+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(b.l)+'</text>';
  });
  return s+'</svg>';
}
function adSection(){
  var P=periodOf(ui.ap,ui.anchor),y=+ui.anchor.slice(0,4),m=+ui.anchor.slice(5,7),K=["live","post","fee","tot","xf","bank","net"];
  var T={live:0,post:0,fee:0,tot:0,xf:0,bank:0,net:0},by={},bk={},nrows=0;
  S.spend.forEach(function(r){
    if(!r.date||r.date<P.from||r.date>P.to)return;
    nrows++;
    var x=spendRow(r);
    var b=by[r.customerId]||(by[r.customerId]={live:0,post:0,fee:0,tot:0,xf:0,bank:0,net:0});
    K.forEach(function(k){T[k]+=x[k];b[k]+=x[k]});
    var key=r.date.slice(0,P.keyLen),q=bk[key]||(bk[key]={live:0,post:0});q.live+=x.live;q.post+=x.post;
  });
  var pick;

/* ĐỊNH NGHĨA DUY NHẤT của "Quá hạn" cho toàn bộ ứng dụng:
   khách còn nợ (tổng đã xuất − đã chuyển > 0) và có ít nhất một dòng chi tiêu chưa thanh toán đã từ OVERDUE_DAYS ngày trở lên.
   Mọi nơi (Tổng quan, Cần thu sớm, Quản lý TKQC Meta, Thống kê, số đỏ trên menu) đều dùng dueSoon() này. */
var OVERDUE_DAYS=3;
var OVERDUE_DEF="Quá hạn = khách còn nợ và có khoản chưa thanh toán từ "+OVERDUE_DAYS+" ngày trở lên.";

/* ô ngày kiểu dd/mm/yyyy và ô chọn tháng tiếng Việt (không phụ thuộc ngôn ngữ trình duyệt) */
function dmy(iso){return iso&&/^\d{4}-\d{2}-\d{2}/.test(iso)?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):""}
function parseDmy(v){var m=String(v).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(!m)return"";var d=+m[1],mo=+m[2],y=+m[3];if(mo<1||mo>12||d<1||d>31||y<2000||y>2100)return"";var dt=new Date(y,mo-1,d);if(dt.getMonth()!==mo-1)return"";return y+"-"+pad(mo)+"-"+pad(d)}
function dateText(id,iso,label){return '<input type="text" inputmode="numeric" id="'+id+'" class="dmy" placeholder="dd/mm/yyyy" maxlength="10" value="'+esc(dmy(iso))+'" aria-label="'+esc(label)+'">'}
function monthSelect(id,val,label){var n=new Date(),o="";
  var list=[];for(var j=3;j>=-36;j--){var d2=new Date(n.getFullYear(),n.getMonth()+j,1);list.push(d2.getFullYear()+"-"+pad(d2.getMonth()+1))}
  if(list.indexOf(val)<0)list.push(val);
  list.forEach(function(k){o+='<option value="'+k+'"'+(k===val?" selected":"")+'>Tháng '+(+k.slice(5,7))+'/'+k.slice(0,4)+'</option>'});
  return '<select id="'+id+'" aria-label="'+esc(label)+'">'+o+'</select>'}
function dueSoon(){
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),by={};
  S.spend.forEach(function(r){
    if(r.paid||!r.date||!cust(r.customerId))return;
    var x=spendRow(r);if(!(x.tot>0))return;
    var d=new Date(+r.date.slice(0,4),+r.date.slice(5,7)-1,+r.date.slice(8,10)).getTime();
    var days=Math.round((t0-d)/86400000);
    if(days<OVERDUE_DAYS)return;
    var b=by[r.customerId]||(by[r.customerId]={n:0,owe:0,days:0,oldest:r.date});
    b.n++;b.owe+=Math.max(0,x.tot-x.xf);
    if(days>b.days){b.days=days;b.oldest=r.date}
  });
  var bal=custBalances();
  return Object.keys(by).filter(function(id){return bal[id]>0}).map(function(id){return{id:id,n:by[id].n,owe:bal[id],days:by[id].days,oldest:by[id].oldest}})
    .sort(function(a,b){return b.days-a.days||b.owe-a.owe});
}

/* các dòng chi tiêu đang để "Chưa thanh toán" và khách còn phải chuyển (tổng − đã chuyển) */
function sum2(a){return a.reduce(function(t,o){return t+o.owe},0)}
function owedRows(){
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),out=[];
  S.spend.forEach(function(r){
    if(r.paid||!r.date||!cust(r.customerId))return;
    var x=spendRow(r),owe=Math.max(0,x.tot-x.xf);if(!owe)return;
    var d=new Date(+r.date.slice(0,4),+r.date.slice(5,7)-1,+r.date.slice(8,10)).getTime();
    out.push({cid:r.customerId,owe:owe,days:Math.round((t0-d)/86400000)});
  });
  return out;
}
/* Chưa thu của từng khách = tổng (phí dịch vụ + chi phí quảng cáo) − khách đã chuyển khoản, trên mọi dòng */
function custBalances(){
  var b={};
  S.spend.forEach(function(r){if(!cust(r.customerId))return;var x=spendRow(r);b[r.customerId]=(b[r.customerId]||0)+x.tot-x.xf});
  Object.keys(b).forEach(function(k){if(b[k]<=0)delete b[k]});
  return b;
}
/* khách có phát sinh chi phí quảng cáo nhưng từ ngày cập nhật gần nhất đến nay đã từ 2 ngày trở lên không có chi phí mới */
function idleCustomers(){
  var now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),last={};
  S.spend.forEach(function(r){

    var x=spendRow(r);if(!(x.live+x.post>0))return;

  return Object.keys(last).map(function(id){

}

/* so sánh số Facebook (Spend hiện tại) với bảng chi tiêu trong một khoảng ngắn, để phát hiện lệch */
function fbDiff(from,to){
  var a=new Date(+from.slice(0,4),+from.slice(5,7)-1,+from.slice(8,10)),b=new Date(+to.slice(0,4),+to.slice(5,7)-1,+to.slice(8,10));
  if(Math.round((b-a)/86400000)>6)return null;
  var F={},L={},keys={};
  S.fbspend.forEach(function(r){if(!r.date||r.date<from||r.date>to||!cust(r.customerId))return;var k=r.customerId+"|"+r.date,o=F[k]||(F[k]={live:0,post:0});o.live+=Number(r.live)||0;o.post+=Number(r.post)||0;keys[k]=1});
  S.spend.forEach(function(r){if(!r.date||r.date<from||r.date>to||!cust(r.customerId))return;var k=r.customerId+"|"+r.date,o=L[k]||(L[k]={live:0,post:0,n:0});o.live+=Number(r.adLive)||0;o.post+=Number(r.adPost)||0;o.n++;keys[k]=1});
  var items=[],fb=0,led=0;
  Object.keys(keys).forEach(function(k){
    var f=F[k]||{live:0,post:0},l=L[k]||{live:0,post:0,n:0},ft=f.live+f.post,lt=l.live+l.post;
    if(!F[k])return; /* chỉ so khi Facebook có số; ngày không có số Facebook là dòng nhập tay */
    fb+=ft;led+=lt;
    if(Math.abs(ft-lt)>=1)items.push({c:k.split("|")[0],d:k.split("|")[1],f:f,l:l,ft:ft,lt:lt});
  });
  return{fb:fb,led:led,items:items};
}
async function fbFix(from,to){
  var D=fbDiff(from,to);if(!D||!D.items.length)return;
  var n=0;
  for(var i=0;i<D.items.length;i++){
    var it=D.items[i],rows=S.spend.filter(function(r){return r.customerId===it.c&&r.date===it.d});
    if(rows.length){
      var others=rows.slice(1).reduce(function(t,r){return{l:t.l+(Number(r.adLive)||0),p:t.p+(Number(r.adPost)||0)}},{l:0,p:0});
      await save("spend",rows[0].id,{adLive:Math.max(0,it.f.live-others.l),adPost:Math.max(0,it.f.post-others.p),fromFb:true});

function parseMoney(s){var d=String(s).replace(/[^\d]/g,"");return d?Number(d):0}
function parseRate(s){var n=parseFloat(String(s).replace(",",".").replace(/[^\d.]/g,""));return isNaN(n)?0:Math.min(100,Math.round(n*100)/100)}
function rateOf(r){return r.feeRate!=null&&r.feeRate!==""?Number(r.feeRate):defaultRate(r.customerId)}
function moneyCell(id,col,v,label){return '<td class="cell"><input class="cin n" type="text" inputmode="numeric" autocomplete="off" data-cell="1" data-row="'+esc(id)+'" data-col="'+col+'" value="'+(v?num(v):"")+'" aria-label="'+esc(label)+'"></td>'}
function saveNewCell(el){
  var date=el.dataset.row.slice(4),col=el.dataset.col;
  var ex=S.spend.filter(function(x){return x.customerId===ui.cid&&x.date===date})[0];
  if(ex){el.dataset.row=ex.id;saveCell(el);return}
  var tr=el.closest("tr");if(!tr)return;
  var g=function(c){return tr.querySelector('[data-col="'+c+'"]')};
  var data={customerId:ui.cid,date:date,adLive:parseMoney(g("adLive").value),adPost:parseMoney(g("adPost").value),feeRate:parseRate(g("feeRate").value),transfer:parseMoney(g("transfer").value),paid:false};
  if(!data.adLive&&!data.adPost&&!data.transfer&&data.feeRate===defaultRate(ui.cid))return;
  if(data.transfer>0)data.xfLog=[{at:Date.now(),v:data.transfer}];
  if(ui.pend[date]){
    var v=data[col];ui.pend[date].p.then(function(){var u={};u[col]=v;save("spend",ui.pend[date]&&ui.pend[date].id||ex&&ex.id,u)}).catch(function(){});
    return;
  }
  if(localMode){S.spend.push(Object.assign({id:"l"+(++seq),createdAt:Date.now()},data));render();return}
  var ref=db.collection("spend").doc();
  var pr=ref.set(Object.assign({createdAt:Date.now()},data));
  ui.pend[date]={id:ref.id,p:pr};
  pr.catch(function(e){delete ui.pend[date];toast("Không lưu được: "+((e&&(e.message||e.code))||"lỗi không rõ"))});
  setTimeout(function(){delete ui.pend[date]},6000);
}
function hideDay(date,exceptId){
  if(!date||!ui.cid)return;
  if(S.hidden.some(function(h){return h.customerId===ui.cid&&h.date===date}))return;
  if(S.spend.some(function(x){return x.customerId===ui.cid&&x.date===date&&x.id!==exceptId}))return; // còn dòng khác trong ngày
  save("hidden",null,{customerId:ui.cid,date:date});
}
function setPaidBlank(date,paid){
  var ex=S.spend.filter(function(x){return x.customerId===ui.cid&&x.date===date})[0];
  if(ex){save("spend",ex.id,{paid:paid});return}
  if(ui.pend[date]){ui.pend[date].p.then(function(){save("spend",ui.pend[date]&&ui.pend[date].id,{paid:paid})}).catch(function(){});return}
  var tr=document.querySelector('tr[data-date="'+date+'"]');if(!tr)return;
  var g=function(c){return tr.querySelector('[data-col="'+c+'"]')};
  var data={customerId:ui.cid,date:date,adLive:parseMoney(g("adLive").value),adPost:parseMoney(g("adPost").value),feeRate:parseRate(g("feeRate").value),transfer:parseMoney(g("transfer").value),paid:paid};
  if(data.transfer>0)data.xfLog=[{at:Date.now(),v:data.transfer}];
  if(localMode){S.spend.push(Object.assign({id:"l"+(++seq),createdAt:Date.now()},data));render();return}
  var ref=db.collection("spend").doc(),pr=ref.set(Object.assign({createdAt:Date.now()},data));

function saveCell(el){
  var id=el.dataset.row,col=el.dataset.col;
  if(id.indexOf("new:")===0){saveNewCell(el);return}
  var r=S.spend.filter(function(x){return x.id===id})[0];
  if(!r)return;
  var upd={},v;
  if(col==="date"){
    v=el.value;
    if(!v){el.value=r.date||"";return}
    if(v!==r.date)upd.date=v;
  }else if(col==="feeRate"){
    v=parseRate(el.value);
    if(v!==rateOf(r))upd.feeRate=v;else el.value=String(v).replace(".",",");
  }else{
    v=parseMoney(el.value);
    if(v!==(Number(r[col])||0))upd[col]=v;else el.value=v?num(v):"";
  }
  if(Object.keys(upd).length)save("spend",id,upd);
}

function recalcLedger(){
  var trs=document.querySelectorAll("table.ledger tbody tr");
  if(!trs.length)return;
  var bal=0,tl=0,tp=0,tf=0,tt=0,tx=0,MS={};
  trs.forEach(function(tr){
    if(tr.classList.contains("mh"))return;
    var g=function(c){return tr.querySelector('[data-col="'+c+'"]')};
    var live=parseMoney(g("adLive").value),post=parseMoney(g("adPost").value),rate=parseRate(g("feeRate").value),xf=parseMoney(g("transfer").value);
    var fee=Math.round((live+post)*rate/100),tot=live+post+fee;
    bal+=tot-xf;tl+=live;tp+=post;tf+=fee;tt+=tot;tx+=xf;
    var dv=g("date"),mk=String(dv?dv.value:(tr.dataset.month||"")).slice(0,7),m=MS[mk]||(MS[mk]={live:0,post:0,fee:0,tot:0,xf:0,n:0});
    m.live+=live;m.post+=post;m.fee+=fee;m.tot+=tot;m.xf+=xf;if(dv)m.n++;

function liveFormat(el){
  var col=el.dataset.col;
  if(col==="date"||col==="feeRate")return;
  var v=el.value,pos=el.selectionStart==null?v.length:el.selectionStart;
  var digitsAfter=v.slice(pos).replace(/\D/g,"").length;
  var n=parseMoney(v),f=n?num(n):"";
  if(f===v)return;
  el.value=f;
  var p=f.length,cnt=0;
  while(p>0&&cnt<digitsAfter){p--;if(/\d/.test(f.charAt(p)))cnt++}
  try{el.setSelectionRange(p,p)}catch(x){}

/* số liệu tổng hợp từ bảng chi tiêu từng khách: đã xuất (phí + quảng cáo), đã chuyển khoản, theo khách và theo tháng */
function ledger(){
  var L={per:{},mTot:{},mXf:{},tot:0,xf:0};
  S.spend.forEach(function(r){
    if(!cust(r.customerId))return;var x=spendRow(r);
    var c=L.per[r.customerId]||(L.per[r.customerId]={tot:0,xf:0});c.tot+=x.tot;c.xf+=x.xf;L.tot+=x.tot;L.xf+=x.xf;
    var m=(r.date||"").slice(0,7);if(m){L.mTot[m]=(L.mTot[m]||0)+x.tot;L.mXf[m]=(L.mXf[m]||0)+x.xf}
  });
  return L;
}
/* trạng thái công nợ từng khách: Đã thu (hết nợ), Chờ thu (còn nợ, dưới 3 ngày), Quá hạn (có dòng chưa thanh toán từ 3 ngày) */
function debtRows(){
  var L=ledger(),late={};dueSoon().forEach(function(l){late[l.id]=l});
  return Object.keys(L.per).filter(function(id){return L.per[id].tot>0}).map(function(id){
    var c=L.per[id],bal=c.tot-c.xf,st=bal<=0?"paid":(late[id]?"overdue":"pending");
    return{id:id,tot:c.tot,xf:c.xf,bal:bal,st:st,days:late[id]?late[id].days:0,oldest:late[id]?late[id].oldest:""};
  }).sort(function(a,b){var o={overdue:0,pending:1,paid:2};return o[a.st]-o[b.st]||b.bal-a.bal});
}

function niceMax(v){var p=Math.pow(10,Math.floor(Math.log10(v)));var c=[1,2,4,5,10];for(var i=0;i<c.length;i++){if(c[i]*p>=v)return c[i]*p}return 10*p}
function chartSvg(){
  var months=[],d=new Date();
  for(var i=5;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(x.getFullYear()+"-"+pad(x.getMonth()+1))}
  var LG=ledger(),inv=months.map(function(m){return LG.mTot[m]||0});
  var col=months.map(function(m){return LG.mXf[m]||0});
  var mx=niceMax(Math.max(1,Math.max.apply(null,inv),Math.max.apply(null,col)));
  var W=640,H=250,L=56,R=10,T=12,B=28,pw=W-L-R,ph=H-T-B,gw=pw/6,bw=Math.min(26,gw*.28);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Biểu đồ doanh thu đã xuất và đã thu theo tháng">';
  for(var t=0;t<=4;t++){var y=T+ph-ph*t/4;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+short(mx*t/4)+'</text>'}
  months.forEach(function(m,i){

function debtAging(C,bal){

    function put(amt,days){for(var i=0;i<B.length;i++){if(days<=B[i].max){B[i].v+=amt;break}}wsum+=amt*days;tsum+=amt}
    rows.forEach(function(r){if(rem<=0||!(r.tot>0))return;var take=Math.min(rem,r.tot),days=Math.max(0,Math.round((t0-new Date(+r.date.slice(0,4),+r.date.slice(5,7)-1,+r.date.slice(8,10)).getTime())/86400000));put(take,days);rem-=take});

function tagKpis(root){
  (root||document).querySelectorAll(".kpis .kpi").forEach(function(k){
    var sp=k.querySelector("span");if(!sp)return;var t=sp.textContent||"",ic="chart";
    for(var i=0;i<KPI_IC.length;i++){if(KPI_IC[i][0].test(t)){ic=KPI_IC[i][1];break}}

  var m=ui.autoBk;if(!m||!m.date){toast("Chưa có bản sao lưu tự động");return}

    var blob=new Blob([JSON.stringify(out,null,1)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="sao-luu-tu-dong-"+m.date+".json";document.body.appendChild(a);a.click();

  var F=FORMS[type],rec=id?S[type].find(function(x){return x.id===id}):null;
  if(type==="payments"&&!S.customers.length){toast("Hãy thêm khách hàng trước");location.hash="#khach-hang";return}
  var val=function(k){return rec&&rec[k]!=null?rec[k]:((type==="payments"&&k==="issueDate")||(type==="spend"&&k==="date")?todayStr():(type==="customers"&&k==="feeRate")?DEFAULT_FEE:(type==="spend"&&k==="feeRate")?defaultRate(rec?rec.customerId:ui.cid):"")};
  var body=F.fields.map(function(f,i){
    var v=val(f.k),inp;
    if(f.t==="textarea")inp='<textarea id="f-'+f.k+'" rows="2">'+esc(v)+'</textarea>';
    else if(f.t==="select")inp='<select id="f-'+f.k+'">'+f.o.map(function(o){return '<option'+(o===v?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>';
    else if(f.t==="cust")inp='<select id="f-'+f.k+'"><option value="">Chọn khách hàng</option>'+S.customers.map(function(c){return '<option value="'+esc(c.id)+'"'+(c.id===v?" selected":"")+'>'+esc(c.name)+'</option>'}).join("")+'</select>';
    else inp='<input id="f-'+f.k+'" type="'+f.t+'" value="'+esc(v)+'"'+(f.ph?' placeholder="'+esc(f.ph)+'"':"")+(f.t==="number"?' min="0"'+(f.max?' max="'+f.max+'"':"")+' step="'+(f.step||1000)+'" inputmode="decimal"':"")+'>';
    return {two:f.two,html:'<div class="field"><label for="f-'+f.k+'">'+esc(f.l)+(f.req?" *":"")+'</label>'+inp+'<span class="err" id="e-'+f.k+'"></span></div>'};
  });
  var out="",i=0;
  while(i<body.length){if(body[i].two&&body[i+1]&&body[i+1].two){out+='<div class="two">'+body[i].html+body[i+1].html+'</div>';i+=2}else{out+=body[i].html;i++}}
  $("#modal-root").innerHTML='<div class="overlay" data-act="close-bg"><form class="modal" id="form" role="dialog" aria-modal="true" aria-labelledby="mt" novalidate><h2 id="mt">'+F.title[rec?1:0]+'</h2>'+out
    +'<div class="foot">'+(rec?'<button type="button" class="btn danger" id="del">Xóa</button>':"")+'<div class="grp"><button type="button" class="btn" data-act="close">Hủy</button><button type="submit" class="btn primary">Lưu</button></div></div></form></div>';
  var first=$("#form input,#form select,#form textarea");if(first)first.focus();
  var del=$("#del");
  if(del)del.addEventListener("click",function(){
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Bấm lại để xóa";return}
    closeModal();
    if(type==="customers"){S.spend.filter(function(x){return x.customerId===id}).forEach(function(x){remove("spend",x.id)});ui.cid=""}
    remove(type,id);
  });
  $("#form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var data={},ok=true;
    F.fields.forEach(function(f){
      var el=$("#f-"+f.k),v=el.value.trim(),err=$("#e-"+f.k);err.textContent="";
      if(f.req&&!v){err.textContent="Mục này cần điền";ok=false}
      if(f.t==="number"){v=v===""?(f.req?"":0):Number(v);if(v!==""&&(isNaN(v)||v<0)){err.textContent="Nhập số không âm";ok=false}else if(v!==""&&f.max&&v>f.max){err.textContent="Tối đa "+f.max;ok=false}}
      if(f.k==="paidDate"&&!v)v=null;
      data[f.k]=v;
    });
    if(type==="payments"&&data.issueDate&&data.dueDate&&data.dueDate<data.issueDate){$("#e-dueDate").textContent="Hạn phải sau ngày xuất";ok=false}
    if(type==="spend"&&ok&&!(data.adLive||data.adPost||data.transfer)){$("#e-adLive").textContent="Nhập ít nhất một khoản tiền";ok=false}
    if(!ok)return;
    if(type==="spend")data.customerId=rec?rec.customerId:ui.cid;
    closeModal();save(type,id||null,data);
  });
}
function closeModal(){$("#modal-root").innerHTML=""}
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var a=el.dataset.act;
  if(ui.delArm&&a!=="sdel"){ui.delArm="";render()}
  if(a==="close-bg"){if(e.target===el)closeModal();return}
  if(a==="close")closeModal();
  else if(a==="add")openForm(el.dataset.type,null);
  else if(a==="edit")openForm(el.dataset.type,el.dataset.id);
  else if(a==="pay")save("payments",el.dataset.id,{paidDate:todayStr()});
  else if(a==="unpay")save("payments",el.dataset.id,{paidDate:null});
  else if(a==="pf"){ui.pf=el.dataset.v;render()}
  else if(a==="clear-ex")clearExamples();
  else if(a==="open"){ui.cid=el.dataset.id;render();window.scrollTo(0,0)}
  else if(a==="back"){ui.cid="";render()}
  else if(a==="goc"){ui.pendingCid=el.dataset.id;if(location.hash==="#khach-hang"){route()}else{location.hash="#khach-hang"}window.scrollTo(0,0)}
  else if(a==="sadd")addSpendRow();
  else if(a==="newmonth"){var nm=el.dataset.m;ui.mopen[nm]=true;ui.scrollMonth=nm;save("customers",ui.cid,{lastMonth:nm})}
  else if(a==="share")startShare();
  else if(a==="unshare")stopShare();
  else if(a==="copyshare")copyShare();
  else if(a==="sharecamps"){var cc2=cust(ui.cid);if(cc2){save("customers",cc2.id,{shareCamps:!!el.checked})}}
  else if(a==="mtog"){var mk=el.dataset.m;ui.mopen[mk]=!monthOpen(mk);render()}
  else if(a==="sdel"){if(ui.delArm===el.dataset.id){ui.delArm="";var rr=S.spend.filter(function(x){return x.id===el.dataset.id})[0];remove("spend",el.dataset.id);if(rr)hideDay(rr.date,el.dataset.id)}else{ui.delArm=el.dataset.id;render()}}
  else if(a==="shide")hideDay(el.dataset.date)
  else if(a==="sunhide"){var mk2=el.dataset.m;S.hidden.filter(function(h){return h.customerId===ui.cid&&String(h.date).slice(0,7)===mk2}).forEach(function(h){remove("hidden",h.id)});toast("Đã hiện lại các ngày")}
  else if(a==="ovm"){ui.ovm=el.dataset.v;render()}
  else if(a==="ovshift"){var dv=+el.dataset.v;if((ui.ovm||"day")==="day"){var mo0=ui.ovmo||todayStr().slice(0,7);ui.ovmo=ymd(new Date(+mo0.slice(0,4),+mo0.slice(5,7)-1+dv,1)).slice(0,7)}else ui.ovy=(ui.ovy||new Date().getFullYear())+dv;render()}
  else if(a==="ovnow"){ui.ovy=new Date().getFullYear();ui.ovmo=todayStr().slice(0,7);render()}
  else if(a==="apt"){ui.ap=el.dataset.v;render()}
  else if(a==="apshift"){ui.anchor=shiftAnchor(ui.ap,ui.anchor,+el.dataset.v);render()}
  else if(a==="apnow"){ui.anchor=todayStr();render()}
  else if(a==="spt"){ui.spt=el.dataset.v;render()}
  else if(a==="ovp"){ui.ovp=el.dataset.v;render()}
  else if(a==="phg"){ui.phg=el.dataset.v;render()}
  else if(a==="fbfix"){if(confirm("Ghi đè số chi tiêu trong bảng của các khách bị lệch bằng số Facebook?"))fbFix(el.dataset.from,el.dataset.to)}
  else if(a==="spaid"){if(el.dataset.id.indexOf("new:")===0)setPaidBlank(el.dataset.id.slice(4),el.dataset.v==="1");else save("spend",el.dataset.id,{paid:el.dataset.v==="1"})}
});
function releasePointer(){pointerDown=false;if(pendingRender){pendingRender=false;render()}}
document.addEventListener("pointerdown",function(){pointerDown=true},true);
document.addEventListener("pointerup",function(){setTimeout(releasePointer,350)},true);
document.addEventListener("pointercancel",function(){setTimeout(releasePointer,0)},true);
document.addEventListener("click",function(){setTimeout(releasePointer,0)});
document.addEventListener("focusout",function(e){var t=e.target;if(!rendering&&t.dataset&&t.dataset.cell)setTimeout(function(){saveCell(t)},0)});
var justFocused=null;
document.addEventListener("focusin",function(e){
  var t=e.target;
  if(restoring)return;
  if(t.dataset&&t.dataset.cell&&t.type==="text"){try{t.select()}catch(x){}justFocused=t}
});
document.addEventListener("mouseup",function(e){
  if(justFocused&&e.target===justFocused)e.preventDefault();
  justFocused=null;
},true);
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key!=="Enter"||!(t.dataset&&t.dataset.cell))return;
  e.preventDefault();
  var list=Array.prototype.slice.call(document.querySelectorAll('[data-cell][data-col="'+t.dataset.col+'"]')).filter(function(x){return x.offsetParent!==null}),i=list.indexOf(t);
  if(i>=0&&i<list.length-1)list[i+1].focus();else{t.blur();addSpendRow()}
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="daysl"){var d=+t.value,lb=document.getElementById("dayval");if(lb)lb.textContent="Ngày "+d;jumpDay(t.dataset.m,d);return}
  if(t.id==="q"){ui.q=t.value;render();return}
  if(t.dataset&&t.dataset.cell){liveFormat(t);recalcLedger()}
});
document.addEventListener("change",function(e){
  var id=e.target.id,v=e.target.value;
  if(e.target.classList&&e.target.classList.contains("bank-in")){
    var rb=String(v).replace(/\D/g,"");
    db.collection("fbaccounts").doc("__bank").set({amount:rb?Number(rb):null},{merge:true}).catch(function(er){toast("Không lưu được số dư: "+((er&&(er.message||er.code))||"lỗi"))});
    return;
  }
  if(e.target.classList&&e.target.classList.contains("bill-in")){
    db.collection("fbaccounts").doc(e.target.dataset.id).set({billManual:parseDmy(v)||null},{merge:true}).catch(function(er){toast("Không lưu được ngày: "+((er&&(er.message||er.code))||"lỗi"))});
    return;
  }
  if(e.target.classList&&e.target.classList.contains("thr-in")){
    var raw=String(v).replace(/\D/g,""),aid=e.target.dataset.id;
    db.collection("fbaccounts").doc(aid).set({thresholdManual:raw?Number(raw):null},{merge:true}).catch(function(er){toast("Không lưu được ngưỡng: "+((er&&(er.message||er.code))||"lỗi"))});
    return;
  }
  if(id==="phc"){ui.phc=v;render()}
  else if(id==="pc"){ui.pc=v;render()}
  else if(id==="vw-day"){ui.vday=v;if(ui.vdata){$("#main").innerHTML=viewerHtml(ui.vdata);tagKpis($("#main"))}}
  else if(id==="ov-day"){var iv=parseDmy(v);if(iv){ui.ovd=iv;ui.ovp="day";render()}else if(v){toast("Nhập ngày theo dạng dd/mm/yyyy, ví dụ 28/10/2026")}}
  else if(id==="ov-month"){if(v){ui.ovmo=v;render()}}
  else if(id==="ov-year"){var yy=Math.round(Number(v));if(yy>=2000&&yy<=2100){ui.ovy=yy;render()}}
  else if(id==="ap-date"){var iv2=parseDmy(v);if(iv2){ui.anchor=iv2;render()}else if(v){toast("Nhập ngày theo dạng dd/mm/yyyy, ví dụ 28/10/2026")}}
  else if(id==="ap-month"){if(v){ui.anchor=v+"-01";render()}}
  else if(id==="ap-q"||id==="ap-year"){
    var yEl=$("#ap-year"),yr=Math.round(Number(yEl&&yEl.value));
    if(!yr||yr<2000||yr>2100)yr=+ui.anchor.slice(0,4);
    var qEl=$("#ap-q"),q=qEl?+qEl.value:1;
    ui.anchor=yr+"-"+pad(ui.ap==="quarter"?(q-1)*3+1:1)+"-01";render();
  }
});

route();
init();
})();
</script>
